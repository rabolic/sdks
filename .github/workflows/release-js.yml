# Publishes the JS packages when a js-vX.Y.Z tag is pushed: @rabolic/web,
# @rabolic/node, rabolic (the CLI) and create-rabolic, all at the tag's version.
# npm trusted publishing: npm checks this workflow's OIDC identity, so the
# repository stores no npm token, and every release carries provenance.
name: Release JS

on:
  push:
    tags: ['js-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package versions
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          for pkg in web node cli create-rabolic; do
            actual=$(node -p "require('./$pkg/package.json').version")
            [ "$actual" = "$version" ] || { echo "::error::$pkg/package.json is $actual, the tag is $version"; exit 1; }
            # The version the code reports (src/version.ts) must match too.
            if [ -f "$pkg/src/version.ts" ] && ! grep -q "'$version'" "$pkg/src/version.ts"; then
              echo "::error::$pkg/src/version.ts doesn't say $version"; exit 1
            fi
          done

      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

      # pnpm pack rewrites workspace: ranges; npm publishes the tarball with OIDC.
      # A version already on npm is skipped, so a failed run can be re-run.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          # In dependency order: create-rabolic depends on rabolic.
          for pkg in web node cli create-rabolic; do
            name=$(node -p "require('./$pkg/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP")
            # pnpm names the tarball after the package: @rabolic/web → rabolic-web-<version>.tgz.
            tarball="$(echo "$name" | sed 's/^@//; s#/#-#')-$version.tgz"
            npm publish "$RUNNER_TEMP/$tarball" --access public
          done

  # Puts the <script> build of @rabolic/web on cdn.rabolic.com (Cloudflare R2
  # bucket rabolic-cdn). The file comes from the npm tarball, checked against
  # the registry's integrity, so the CDN serves exactly what npm has.
  # The R2 token in the cdn environment can write to that bucket only.
  cdn:
    needs: publish
    runs-on: ubuntu-latest
    environment: cdn
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - name: Fetch the published script
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          # A new version can take a few minutes to appear on the registry.
          for _ in $(seq 1 30); do
            meta=$(curl -fsS "https://registry.npmjs.org/@rabolic/web/$version") && break
            sleep 10
          done
          [ -n "${meta:-}" ] || { echo "::error::@rabolic/web@$version is not on the registry"; exit 1; }
          curl -fsS -o web.tgz "$(jq -r .dist.tarball <<<"$meta")"
          actual="sha512-$(openssl dgst -sha512 -binary web.tgz | base64 -w0)"
          [ "$actual" = "$(jq -r .dist.integrity <<<"$meta")" ] || { echo "::error::tarball integrity mismatch"; exit 1; }
          tar -xzf web.tgz package/dist/rabolic.global.js

      # v1/<version>/rabolic.js never changes. v1/rabolic.js is what the
      # snippet loads; a pre-release (1.2.0-beta.1) leaves it alone.
      - name: Upload to R2
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          put() {
            aws s3 cp package/dist/rabolic.global.js "s3://rabolic-cdn/$1" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors \
              --content-type 'application/javascript; charset=utf-8' --cache-control "$2"
            echo "uploaded https://cdn.rabolic.com/$1"
          }
          put "v1/$version/rabolic.js" 'public, max-age=31536000, immutable'
          case "$version" in
            *-*) echo "pre-release: v1/rabolic.js stays on the previous release" ;;
            *) put v1/rabolic.js 'public, max-age=3600' ;;
          esac

      - name: Check the CDN serves it
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          expected=$(sha256sum < package/dist/rabolic.global.js)
          actual=$(curl -fsS "https://cdn.rabolic.com/v1/$version/rabolic.js" | sha256sum)
          [ "$actual" = "$expected" ] || { echo "::error::cdn.rabolic.com/v1/$version/rabolic.js differs from the npm build"; exit 1; }
