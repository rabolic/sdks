# Publishes rabolic_flutter when a flutter-vX.Y.Z tag is pushed.
# pub.dev automated publishing: pub.dev checks this workflow's OIDC identity
# (tag pattern `flutter-v{{version}}`, environment `pub.dev`), so the
# repository stores no credentials.
name: Release Flutter

on:
  push:
    tags: ['flutter-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exchanges the OIDC token for a pub.dev token. The package depends on
      # Flutter, so the Flutter SDK below does the publishing.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Check the tag matches pubspec.yaml and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#flutter-v}"
          actual=$(sed -n 's/^version: *//p' pubspec.yaml)
          [ "$actual" = "$version" ] || { echo "::error::pubspec.yaml is $actual, the tag is $version"; exit 1; }
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --force
