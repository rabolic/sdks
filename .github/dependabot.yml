# Weekly update PRs. Actions are pinned to commit SHAs, so this is what keeps
# them current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    groups:
      dev-tools:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: weekly
