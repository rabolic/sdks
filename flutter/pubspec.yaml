name: rabolic_flutter
description: >-
  Rabolic product analytics for Flutter. Pure Dart SDK for iOS, Android and
  web with a persisted queue, sessions, lifecycle events and screen tracking.
version: 0.1.0
homepage: https://rabolic.com
repository: https://github.com/rabolic/sdks/tree/main/flutter
issue_tracker: https://github.com/rabolic/sdks/issues
topics:
  - analytics
  - product-analytics
  - tracking
  - events

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

platforms:
  android:
  ios:
  web:

dependencies:
  device_info_plus: ^13.1.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_schema: ^5.2.2
